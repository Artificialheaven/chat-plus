# /etc/nginx/sites-available/syd.eastcloud.top.conf
# 首次部署：certbot --nginx -d <域名> 会在这份配置上补 443 与证书段。
server {
    server_name syd.eastcloud.top;

    root /var/www/syd.eastcloud.top;
    index index.html;

    access_log /var/log/nginx/syd.eastcloud.top.access.log;
    error_log  /var/log/nginx/syd.eastcloud.top.error.log warn;

    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~ /\.(?!well-known) { deny all; }

    # 带 contenthash 的产物：一年不可变缓存
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
        try_files $uri =404;
    }

    # 入口 HTML 不缓存，保证发版即时生效
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json font/woff2;

    listen 80;
    listen [::]:80;
}
